site_name: Pydantask Agent Harness
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Use Cases: use_cases.md
  - Agent Concepts: agents.md
  - Models: models.md
  - Tools: tools.md
  - Customization: customization.md
  - API Reference: api.md

theme:
  name: material
  palette:
    - scheme: default        # light mode
      primary: blue grey   # calm, professional neutral
      accent: teal           # clear but not loud accent
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate          # dark mode
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
      guess_lang: false
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
