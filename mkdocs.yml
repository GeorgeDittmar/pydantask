theme:
  name: material
  palette:
    - scheme: default        # light mode
      primary: blue grey     # calm, professional neutral
      accent: teal           # clear but not loud accent
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate          # dark mode
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
